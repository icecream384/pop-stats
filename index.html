<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人口统计查询工具</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;background:#f0f2f5}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #d9d9d9;flex-shrink:0;z-index:1000;flex-wrap:wrap}
.toolbar label{font-size:12px;color:#555;white-space:nowrap}
.toolbar select,.toolbar input{padding:5px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#4096ff}
.city-wrap{position:relative;width:120px}
.city-wrap input{width:100%}
.city-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d9d9d9;border-top:none;max-height:200px;overflow-y:auto;display:none;z-index:1002;list-style:none;font-size:12px}
.city-dropdown li{padding:6px 10px;cursor:pointer}
.city-dropdown li:hover{background:#e6f4ff}
.search-wrap{position:relative;flex:1;min-width:150px;max-width:350px}
.search-wrap input{width:100%}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d9d9d9;border-top:none;max-height:220px;overflow-y:auto;display:none;z-index:1002;list-style:none;font-size:12px}
.search-dropdown li{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.search-dropdown li:hover{background:#e6f4ff}
.search-dropdown li .sname{font-weight:500}
.search-dropdown li .saddr{font-size:11px;color:#999;margin-left:6px}
.radius-wrap{display:flex;align-items:center;gap:4px}
.radius-wrap input{width:70px;text-align:right}
.btn{padding:5px 14px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:#1677ff;color:#fff}
.btn-outline{background:#fff;color:#555;border:1px solid #d9d9d9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{display:flex;flex:1;overflow:hidden}
.map-container{flex:1;position:relative;min-width:0}
.map-container .loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);z-index:999;display:flex;align-items:center;justify-content:center;font-size:14px;color:#555;flex-direction:column;gap:8px}
.map-container .loading-overlay.hidden{display:none}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#1677ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.results-panel{width:760px;flex-shrink:0;background:#fff;border-left:1px solid #d9d9d9;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.results-panel h3{font-size:14px;color:#333}
.results-table{width:100%;border-collapse:collapse;font-size:11px}
.results-table th,.results-table td{padding:6px 7px;border:1px solid #d0d0d0;text-align:center;white-space:nowrap}
.results-table th{background:#f5f5f5;font-weight:700;color:#333}
.results-table td{color:#333}
.results-table .del-btn{color:#ff4d4f;cursor:pointer;font-size:11px;border:none;background:none;font-weight:700}
.results-table .del-btn:hover{text-decoration:underline}
.legend{font-size:11px;color:#999;line-height:1.8}
.hint{font-size:12px;color:#bbb;text-align:center;padding:40px 0}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:768px){.main{flex-direction:column}.results-panel{width:100%;max-height:40vh}.toolbar{gap:6px;padding:6px 8px}}
</style>
</head>
<body>

<!-- Password Gate -->
<div id="pwdGate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Microsoft YaHei',Arial,sans-serif">
<div style="text-align:center;color:#eee">
<div style="font-size:48px;margin-bottom:16px">🔒</div><h2 style="margin-bottom:8px;font-weight:400">人口统计查询工具</h2>
<p style="color:#888;font-size:13px;margin-bottom:24px">请输入访问密码</p>
<input id="pwdInput" type="password" placeholder="密码" style="padding:10px 16px;border:1px solid #555;border-radius:6px;font-size:15px;width:200px;text-align:center;outline:none;background:#16213e;color:#eee" autofocus>
<div id="pwdError" style="color:#ff6b6b;font-size:12px;margin-top:10px;display:none">密码错误</div><br>
<button id="pwdBtn" style="margin-top:14px;padding:8px 32px;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">确 定</button>
</div></div>
<script>
(function(){
var i=document.getElementById('pwdInput'),b=document.getElementById('pwdBtn'),e=document.getElementById('pwdError');
function c(){if(i.value==='384384'){document.getElementById('pwdGate').style.display='none';localStorage.setItem('_pwd','1')}else{e.style.display='block';i.value=''}}
if(localStorage.getItem('_pwd')==='1')document.getElementById('pwdGate').style.display='none';
b.addEventListener('click',c);i.addEventListener('keydown',function(ev){if(ev.key==='Enter')c()})
})();
</script>

<div class="toolbar">
<label>城市</label><div class="city-wrap"><input type="text" id="cityInput" placeholder="选择城市..." autocomplete="off"><ul class="city-dropdown" id="cityDropdown"></ul></div>
<div class="search-wrap"><input type="text" id="searchInput" placeholder="搜索地点..." autocomplete="off"><ul class="search-dropdown" id="searchDropdown"></ul></div>
<label>半径</label><div class="radius-wrap"><input type="number" id="radiusInput" value="3000" min="100" max="50000" step="100"><span style="font-size:11px;color:#999">米</span></div>
<button class="btn btn-primary" id="addBtn">📍 添加地块</button>
<button class="btn btn-outline" id="clearAllBtn">✕ 全部清除</button>
<button class="btn btn-primary" id="copyBtn" disabled>📋 复制结果</button>
</div>

<div class="main">
<div class="map-container" id="mapContainer"><div id="map" style="width:100%;height:100%"></div><div class="loading-overlay hidden" id="loadingOverlay"><div class="spinner"></div><div id="loadingText">加载数据中…</div></div></div>
<div class="results-panel" id="resultsPanel"><div class="hint">👆 在地图上点选位置，然后点「添加地块」</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
var AMAP_KEY='653175298a4a55e4a56de4bedc412dd6';
var GRID_S=500,GRID_A=GRID_S*GRID_S,GRID_C=GRID_S*Math.SQRT2/2,SCALE=100000;
var CDN_BASE='https://cdn.jsdelivr.net/gh/icecream384/pop-stats@main/data/';
var CITIES=['北京','上海','广州','深圳','成都','重庆','杭州','武汉','西安','南京','天津','苏州','长沙','郑州','东莞','青岛','沈阳','佛山','济南','大连','合肥','无锡','宁波','厦门','福州','温州','南宁','贵阳','昆明','南昌','海口','太原','石家庄','兰州','烟台','泉州','徐州','常州','南通','扬州','绍兴','嘉兴','台州','金华','盐城','宜昌','襄阳','珠海','咸阳','三亚','连云港','宿迁'];
var CC={北京:[116.4075,39.9042],上海:[121.4737,31.2304],广州:[113.2644,23.1291],深圳:[114.0579,22.5431],成都:[104.0658,30.6575],重庆:[106.5516,29.5630],杭州:[120.1551,30.2741],武汉:[114.3054,30.5931],西安:[108.9402,34.2611],南京:[118.7969,32.0603],天津:[117.1901,39.1252],苏州:[120.5853,31.2989],长沙:[112.9388,28.2278],郑州:[113.6254,34.7466],东莞:[113.7518,23.0205],青岛:[120.3826,36.0671],沈阳:[123.4315,41.8057],佛山:[113.1219,23.0215],济南:[117.1205,36.6512],大连:[121.6147,38.9140],合肥:[117.2272,31.8206],无锡:[120.3119,31.4912],宁波:[121.5504,29.8683],厦门:[118.0894,24.4798],福州:[119.2965,26.0745],温州:[120.6994,27.9943],南宁:[108.3661,22.8170],贵阳:[106.6302,26.6477],昆明:[102.8329,24.8801],南昌:[115.8579,28.6820],海口:[110.1983,20.0440],太原:[112.5489,37.8706],石家庄:[114.5149,38.0428],兰州:[103.8343,36.0611],烟台:[121.4479,37.4635],泉州:[118.6759,24.8741],徐州:[117.2841,34.2048],常州:[119.9740,31.8107],南通:[120.8937,31.9806],扬州:[119.4129,32.3936],绍兴:[120.5802,30.0318],嘉兴:[120.7556,30.7460],台州:[121.4206,28.6563],金华:[119.6476,29.0792],盐城:[120.1616,33.3495],宜昌:[111.2865,30.6918],襄阳:[112.1224,32.0090],珠海:[113.5767,22.2707],咸阳:[108.7091,34.3298],三亚:[109.5119,18.2528],连云港:[119.2229,34.5967],宿迁:[118.2754,33.9615]};

var map,circleLayer,loadingOverlay,loadingText,pendingCenter=null,resultsList=[],nextId=1,searchTimer=null,citySearchTimer=null;
// cityCache: {cityName: {bbox, grids, meta:{n,b,s,m,c,t}}}
var cityCache={};
var COLORS=['#1677ff','#52c41a','#fa8c16','#722ed1','#eb2f96','#13c2c2','#f5222d','#2f54eb'];

// ============================================================
// Init
// ============================================================
function initMap(){
map=L.map('map',{zoomControl:true}).setView(CC['成都'].reverse(),12);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',attribution:'&copy; 高德',maxZoom:18}).addTo(map);
circleLayer=L.layerGroup().addTo(map);
map.on('click',function(e){pendingCenter=[e.latlng.lng,e.latlng.lat];reverseGeocode(e.latlng.lng,e.latlng.lat);drawAll()});
loadingOverlay=document.getElementById('loadingOverlay');
loadingText=document.getElementById('loadingText');
}

// ============================================================
// Data: parallel chunked loading via jsDelivr CDN
// ============================================================
function showLoad(msg){loadingText.textContent=msg;loadingOverlay.classList.remove('hidden')}
function hideLoad(){loadingOverlay.classList.add('hidden')}

async function loadCity(name){
// if already cached and loaded, just return
if(cityCache[name]&&cityCache[name].grids){return}

showLoad('加载 '+name+' 数据…');

// Try chunked format first (CDN)
try{
var metaResp=await fetch(CDN_BASE+name+'/meta.json',{cache:'force-cache'});
if(metaResp.ok){
var meta=await metaResp.json();
// Load all chunks in parallel
var chunks=[];
for(var i=0;i<meta.c;i++){
chunks.push(fetch(CDN_BASE+name+'/'+i+'.json',{cache:'force-cache'}));
}
loadingText.textContent='加载 '+name+' ('+meta.c+'分片)…';
var responses=await Promise.all(chunks);
var allGrids=[];
for(var i=0;i<responses.length;i++){
if(!responses[i].ok)throw new Error('chunk '+i+' failed');
var cdata=await responses[i].json();
allGrids=allGrids.concat(cdata.g);
}
cityCache[name]={bbox:meta.b,grids:allGrids,meta:meta};
console.log(name+': loaded '+meta.t+' grids from '+meta.c+' chunks');
hideLoad();
return;
}
}catch(e){console.log('CDN chunked failed, trying single file: '+e.message)}

// Fallback: single file
try{
var resp=await fetch(CDN_BASE+name+'.json',{cache:'force-cache'});
if(resp.ok){
var raw=await resp.json();
cityCache[name]={bbox:raw.b,grids:raw.g};
console.log(name+': loaded single file');
hideLoad();
return;
}
}catch(e){}

showToast('加载 '+name+' 失败');
hideLoad();
}

function getGrids(name){
var c=cityCache[name];
return c?c.grids:null;
}

// ============================================================
// City select
// ============================================================
function filterCities(q){q=q.toLowerCase();return CITIES.filter(function(c){return c.includes(q)||c.toLowerCase().includes(q)})}
function showCityDropdown(list){var d=document.getElementById('cityDropdown');d.innerHTML='';
if(!list||!list.length){d.style.display='none';return}
list.forEach(function(c){var l=document.createElement('li');l.textContent=c;l.addEventListener('click',function(){d.style.display='none';document.getElementById('cityInput').value=c;selectCity(c)});d.appendChild(l)});d.style.display='block'}
async function selectCity(name){
// Load city data if needed, but do NOT clear results
await loadCity(name);
var cc=CC[name];if(cc)map.setView(cc.reverse(),12);
pendingCenter=null;drawAll();
}
document.getElementById('cityInput').addEventListener('input',function(){
var q=this.value.trim();clearTimeout(citySearchTimer);
citySearchTimer=setTimeout(function(){showCityDropdown(q.length?filterCities(q):CITIES)},150);
});
document.getElementById('cityInput').addEventListener('focus',function(){showCityDropdown(CITIES)});

// ============================================================
// Search / Geocode
// ============================================================
async function searchSuggestions(kw){
var url='https://restapi.amap.com/v3/assistant/inputtips?keywords='+encodeURIComponent(kw)+'&city='+encodeURIComponent(document.getElementById('cityInput').value||'全国')+'&citylimit=true&output=JSON&key='+AMAP_KEY;
var r=await fetch(url);var d=await r.json();
if(d.status==='1'&&d.tips)return d.tips.filter(function(t){return t.location&&t.location.length>0});
return[];
}
async function geocode(addr){
var url='https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(addr)+'&city='+encodeURIComponent(document.getElementById('cityInput').value||'全国')+'&output=JSON&key='+AMAP_KEY;
var r=await fetch(url);var d=await r.json();
if(d.status==='1'&&d.geocodes&&d.geocodes.length){var l=d.geocodes[0].location.split(',').map(Number);return{lng:l[0],lat:l[1],name:d.geocodes[0].formatted_address}}
return null;
}
async function reverseGeocode(lng,lat){
try{
var url='https://restapi.amap.com/v3/geocode/regeo?location='+lng+','+lat+'&output=JSON&key='+AMAP_KEY;
var r=await fetch(url);var d=await r.json();
if(d.status==='1'&&d.regeocode){
document.getElementById('searchInput').value=d.regeocode.formatted_address||'';
var a=d.regeocode.addressComponent||{};
window._lastRoad=a.road||a.street||(a.neighborhood&&a.neighborhood.name)||a.district||'';
window._lastCity=a.city||'';
}
}catch(e){}
}

// ============================================================
// Drawing
// ============================================================
function drawAll(){
circleLayer.clearLayers();
resultsList.forEach(function(r,i){
var c=COLORS[i%COLORS.length];
circleLayer.addLayer(L.circle([r.lat,r.lng],{radius:r.radius,color:c,fillColor:c,fillOpacity:.1,weight:2,dashArray:'6,4'}));
circleLayer.addLayer(L.marker([r.lat,r.lng],{icon:L.divIcon({html:'<div style="background:'+c+';color:#fff;border-radius:10px;padding:1px 6px;font-size:10px">'+(i+1)+'</div>',iconSize:[0,0],iconAnchor:[-8,8]})}));
});
if(pendingCenter){
circleLayer.addLayer(L.circleMarker([pendingCenter[1],pendingCenter[0]],{radius:8,color:'#ff4d4f',fillColor:'#ff4d4f',fillOpacity:.4,weight:2}));
}
// Fit all
if(resultsList.length||pendingCenter){
var lats=resultsList.map(function(r){return r.lat}),lngs=resultsList.map(function(r){return r.lng});
if(pendingCenter){lats.push(pendingCenter[1]);lngs.push(pendingCenter[0])}
map.fitBounds(L.latLngBounds([[Math.min.apply(null,lats)-.01,Math.min.apply(null,lngs)-.01],[Math.max.apply(null,lats)+.01,Math.max.apply(null,lngs)+.01]]).pad(.2));
}
}

// ============================================================
// Compute
// ============================================================
function computeOne(grids,lng,lat,radius){
var t0=performance.now();
var cp=turf.circle([lng,lat],radius/1000,{steps:64,units:'kilometers'});
var bb=turf.bbox(cp),bx=bb[0],by=bb[1],bx2=bb[2],by2=bb[3];
var ct=turf.point([lng,lat]);
var rp=0,rdw=0,rdwt=0,wp=0,wdw=0,wdwt=0,mp=0,mdw=0,mdwt=0,op=0,odw=0,odwt=0,cov=0,gc=0,fc=0,bc=0;
for(var i=0;i<grids.length;i++){
var g=grids[i],gl=g[0]/SCALE,ga=g[1]/SCALE;
if(gl<bx-.005||gl>bx2+.005||ga<by-.005||ga>by2+.005)continue;
var gp=turf.point([gl,ga]),dist=turf.distance(ct,gp,{units:'meters'}),ratio;
if(dist+GRID_C<=radius){ratio=1;fc++}
else if(dist-GRID_C>=radius)continue;
else{bc++;var lm=1/111320,ll=1/(111320*Math.cos(ga*Math.PI/180)),h=GRID_S/2;
var sq=turf.bboxPolygon([gl-h*ll,ga-h*lm,gl+h*ll,ga+h*lm]);
try{var inter=turf.intersect(cp,sq);if(inter)ratio=Math.min(1,turf.area(inter)/GRID_A);else if(turf.booleanPointInPolygon(gp,cp))ratio=1;else continue}catch(e){if(dist<radius)ratio=1;else continue}}
if(ratio<=0)continue;gc++;var ca=GRID_A*ratio;cov+=ca;
rp+=g[2]*ratio;wp+=g[4]*ratio;mp+=g[6]*ratio;op+=g[8]*ratio;
if(g[3]>0){rdw+=g[3]*ca;rdwt+=ca}if(g[5]>0){wdw+=g[5]*ca;wdwt+=ca}
if(g[7]>0){mdw+=g[7]*ca;mdwt+=ca}if(g[9]>0){odw+=g[9]*ca;odwt+=ca}
}
return{lng:lng,lat:lat,radius:radius,
resPop:rp,resDen:rdwt>0?rdw/rdwt:0,workPop:wp,workDen:wdwt>0?wdw/wdwt:0,
mixPop:mp,mixDen:mdwt>0?mdw/mdwt:0,otPop:op,otDen:odwt>0?odw/odwt:0,
gc:gc,fc:fc,bc:bc,area:cov/1e6,ms:performance.now()-t0};
}

// ============================================================
// Name
// ============================================================
function makeName(lng,lat,radius){
var city=window._lastCity||'',road=window._lastRoad||'';
var rs=radius>=1000?((radius/1000).toFixed(1).replace('.0','')+'km'):radius+'m';
return city+road+'地块'+rs;
}

// ============================================================
// Add / Delete
// ============================================================
async function addResult(){
var cityName=document.getElementById('cityInput').value.trim();
if(!cityName||CITIES.indexOf(cityName)<0){showToast('请选择城市');return}
if(!pendingCenter){showToast('请在地图上点击或搜索地点');return}

await loadCity(cityName);
var grids=getGrids(cityName);
if(!grids){showToast('城市数据加载失败');return}

var lng=pendingCenter[0],lat=pendingCenter[1];
var radius=parseInt(document.getElementById('radiusInput').value)||3000;
var name=makeName(lng,lat,radius);
var stats=computeOne(grids,lng,lat,radius);
resultsList.push({id:nextId++,name:name,lng:lng,lat:lat,radius:radius,city:cityName,s:stats});
pendingCenter=null;drawAll();renderResults();
showToast('已添加: '+name);
}

function deleteOne(id){
resultsList=resultsList.filter(function(r){return r.id!==id});
drawAll();renderResults();
if(!resultsList.length)pendingCenter=null;
showToast('已删除');
}
function clearAll(){resultsList=[];pendingCenter=null;drawAll();renderResults();showToast('已全部清除')}

// ============================================================
// Render
// ============================================================
function fmt(n){return Math.round(n).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function renderResults(){
var p=document.getElementById('resultsPanel'),b=document.getElementById('copyBtn');
if(!resultsList.length){p.innerHTML='<div class="hint">👆 在地图上点选位置，然后点「添加地块」</div>';b.disabled=true;return}
b.disabled=false;
var tg=0,tm=0;resultsList.forEach(function(r){tg+=r.s.gc;tm+=r.s.ms});
var h='<h3>📊 统计结果 <span style="font-weight:400;font-size:12px;color:#999">（'+resultsList.length+'个地块）</span></h3>';
h+='<table class="results-table"><thead><tr><th>编号</th><th>名称</th><th>居住人口(人)</th><th>密度(人/km²)</th><th>工作人口(人)</th><th>密度(人/km²)</th><th>职住净人口(人)</th><th>密度(人/km²)</th><th>加班人口(人)</th><th>密度(人/km²)</th><th>操作</th></tr></thead><tbody>';
resultsList.forEach(function(r,i){var s=r.s;
h+='<tr><td>'+(i+1)+'</td><td>'+r.name+'</td>';
h+='<td>'+fmt(s.resPop)+'</td><td>'+fmt(s.resDen)+'</td>';
h+='<td>'+fmt(s.workPop)+'</td><td>'+fmt(s.workDen)+'</td>';
h+='<td>'+fmt(s.mixPop)+'</td><td>'+fmt(s.mixDen)+'</td>';
h+='<td>'+fmt(s.otPop)+'</td><td>'+fmt(s.otDen)+'</td>';
h+='<td><button class="del-btn" onclick="deleteOne('+r.id+')">🗑️</button></td></tr>';
});
h+='</tbody></table>';
h+='<div class="legend">📐 面积加权交集 | 🔢 总覆盖网格: '+tg+' | ⚡ '+tm.toFixed(0)+'ms<br>📊 数据来源：猎鹰 · 2025年6月</div>';
p.innerHTML=h;
}

// ============================================================
// Copy
// ============================================================
async function copyAll(){
if(!resultsList.length)return;
var rows='';resultsList.forEach(function(r){var s=r.s;
rows+='<tr><td>'+r.name+'</td><td>'+Math.round(s.resPop)+'</td><td>'+Math.round(s.resDen)+'</td><td>'+Math.round(s.workPop)+'</td><td>'+Math.round(s.workDen)+'</td><td>'+Math.round(s.mixPop)+'</td><td>'+Math.round(s.mixDen)+'</td><td>'+Math.round(s.otPop)+'</td><td>'+Math.round(s.otDen)+'</td></tr>';});
var html='<html><body><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-family:\'微软雅黑\',Arial;font-size:11pt"><tr style="font-weight:bold;text-align:center"><td>名称</td><td>居住人口(人)</td><td>密度(人/km²)</td><td>工作人口(人)</td><td>密度(人/km²)</td><td>职住净人口(人)</td><td>密度(人/km²)</td><td>加班人口(人)</td><td>密度(人/km²)</td></tr>'+rows+'</table><p style="font-size:10pt;color:#888">数据来源：猎鹰 · 2025年6月</p></body></html>';
var text=['名称\t居住人口(人)\t密度(人/km²)\t工作人口(人)\t密度(人/km²)\t职住净人口(人)\t密度(人/km²)\t加班人口(人)\t密度(人/km²)'];
resultsList.forEach(function(r){var s=r.s;text.push(r.name+'\t'+Math.round(s.resPop)+'\t'+Math.round(s.resDen)+'\t'+Math.round(s.workPop)+'\t'+Math.round(s.workDen)+'\t'+Math.round(s.mixPop)+'\t'+Math.round(s.mixDen)+'\t'+Math.round(s.otPop)+'\t'+Math.round(s.otDen))});
text.push('数据来源：猎鹰 · 2025年6月');
try{var ci=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text.join('\n')],{type:'text/plain'})});await navigator.clipboard.write([ci]);showToast('✅ 已复制 '+resultsList.length+' 个地块')}
catch(e){try{var el=document.createElement('div');el.innerHTML=html;el.style.cssText='position:absolute;left:-9999px';document.body.appendChild(el);var rng=document.createRange();rng.selectNodeContents(el);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rng);document.execCommand('copy');sel.removeAllRanges();document.body.removeChild(el);showToast('✅ 已复制')}catch(e2){await navigator.clipboard.writeText(text.join('\n'));showToast('✅ 已复制(纯文本)')}}
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}

// ============================================================
// Event bindings
// ============================================================
document.getElementById('searchInput').addEventListener('input',function(){var q=this.value.trim();if(!q){document.getElementById('searchDropdown').style.display='none';return}clearTimeout(searchTimer);searchTimer=setTimeout(async function(){var tips=await searchSuggestions(q),dd=document.getElementById('searchDropdown');dd.innerHTML='';tips.forEach(function(tip){var l=document.createElement('li');l.innerHTML='<span class="sname">'+tip.name+'</span><span class="saddr">'+(tip.district||'')+'</span>';l.addEventListener('click',async function(){dd.style.display='none';document.getElementById('searchInput').value=tip.name;var g=await geocode(tip.name);if(g){pendingCenter=[g.lng,g.lat];drawAll();map.setView([g.lat,g.lng],15)}});dd.appendChild(l)});dd.style.display=tips.length?'block':'none'},300)});
document.getElementById('searchInput').addEventListener('keydown',async function(e){if(e.key==='Enter'){clearTimeout(searchTimer);document.getElementById('searchDropdown').style.display='none';var q=this.value.trim();if(q){var g=await geocode(q);if(g){pendingCenter=[g.lng,g.lat];drawAll();map.setView([g.lat,g.lng],15)}else showToast('未找到')}}});
document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))document.getElementById('searchDropdown').style.display='none';if(!e.target.closest('.city-wrap'))document.getElementById('cityDropdown').style.display='none'});
document.getElementById('radiusInput').addEventListener('change',function(){var v=Math.max(100,Math.min(50000,parseInt(this.value)||3000));this.value=v});
document.getElementById('addBtn').addEventListener('click',addResult);
document.getElementById('clearAllBtn').addEventListener('click',clearAll);
document.getElementById('copyBtn').addEventListener('click',copyAll);

// Service Worker for caching
if('serviceWorker' in navigator){
navigator.serviceWorker.register("data:application/javascript,"+encodeURIComponent(
"self.addEventListener('fetch',function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(r2){var r3=r2.clone();caches.open('v1').then(function(c){c.put(e.request,r3)});return r2})}))});"
)).catch(function(){});
}

// Startup
initMap();
loadCity('成都').then(function(){document.getElementById('cityInput').value='成都'});
</script>
