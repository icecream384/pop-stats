<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人口统计查询工具</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;background:#f0f2f5}

.toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #d9d9d9;flex-shrink:0;z-index:1000;flex-wrap:wrap}
.toolbar label{font-size:12px;color:#555;white-space:nowrap}
.toolbar select,.toolbar input{padding:5px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#4096ff}

.city-wrap{position:relative;width:120px}
.city-wrap input{width:100%}
.city-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d9d9d9;border-top:none;max-height:200px;overflow-y:auto;display:none;z-index:1002;list-style:none;font-size:12px}
.city-dropdown li{padding:6px 10px;cursor:pointer}
.city-dropdown li:hover{background:#e6f4ff}

.search-wrap{position:relative;flex:1;min-width:150px;max-width:350px}
.search-wrap input{width:100%}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d9d9d9;border-top:none;max-height:220px;overflow-y:auto;display:none;z-index:1002;list-style:none;font-size:12px}
.search-dropdown li{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.search-dropdown li:hover{background:#e6f4ff}
.search-dropdown li .sname{font-weight:500}
.search-dropdown li .saddr{font-size:11px;color:#999;margin-left:6px}

.radius-wrap{display:flex;align-items:center;gap:4px}
.radius-wrap input{width:70px;text-align:right}

.btn{padding:5px 14px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:#1677ff;color:#fff}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-outline{background:#fff;color:#555;border:1px solid #d9d9d9}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{display:flex;flex:1;overflow:hidden}
.map-container{flex:1;position:relative;min-width:0}
.map-container .loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);z-index:999;display:flex;align-items:center;justify-content:center;font-size:14px;color:#555;flex-direction:column;gap:8px}
.map-container .loading-overlay.hidden{display:none}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#1677ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.results-panel{width:720px;flex-shrink:0;background:#fff;border-left:1px solid #d9d9d9;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.results-panel h3{font-size:14px;color:#333}

.results-table{width:100%;border-collapse:collapse;font-size:11px}
.results-table th,.results-table td{padding:6px 8px;border:1px solid #d0d0d0;text-align:center;white-space:nowrap}
.results-table th{background:#f5f5f5;font-weight:700;color:#333}
.results-table td{color:#333}
.results-table .del-btn{color:#ff4d4f;cursor:pointer;font-size:11px;border:none;background:none;font-weight:700}
.results-table .del-btn:hover{text-decoration:underline}

.legend{font-size:11px;color:#999;line-height:1.8}
.hint{font-size:12px;color:#bbb;text-align:center;padding:40px 0}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:768px){
.main{flex-direction:column}
.results-panel{width:100%;max-height:40vh}
.toolbar{gap:6px;padding:6px 8px}
}
</style>
</head>
<body>

<!-- Password Gate -->
<div id="pwdGate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Microsoft YaHei',Arial,sans-serif">
<div style="text-align:center;color:#eee">
<div style="font-size:48px;margin-bottom:16px">🔒</div>
<h2 style="margin-bottom:8px;font-weight:400">人口统计查询工具</h2>
<p style="color:#888;font-size:13px;margin-bottom:24px">请输入访问密码</p>
<input id="pwdInput" type="password" placeholder="密码" style="padding:10px 16px;border:1px solid #555;border-radius:6px;font-size:15px;width:200px;text-align:center;outline:none;background:#16213e;color:#eee" autofocus>
<div id="pwdError" style="color:#ff6b6b;font-size:12px;margin-top:10px;display:none">密码错误</div><br>
<button id="pwdBtn" style="margin-top:14px;padding:8px 32px;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">确 定</button>
</div></div>
<script>
(function(){
var inp=document.getElementById('pwdInput'),btn=document.getElementById('pwdBtn'),err=document.getElementById('pwdError');
function chk(){
if(inp.value==='384384'){document.getElementById('pwdGate').style.display='none';localStorage.setItem('_pwd','1')}
else{err.style.display='block';inp.value=''}
}
if(localStorage.getItem('_pwd')==='1')document.getElementById('pwdGate').style.display='none';
btn.addEventListener('click',chk);inp.addEventListener('keydown',function(e){if(e.key==='Enter')chk()})
})();
</script>

<!-- Toolbar -->
<div class="toolbar">
<label>城市</label>
<div class="city-wrap">
<input type="text" id="cityInput" placeholder="选择城市..." autocomplete="off">
<ul class="city-dropdown" id="cityDropdown"></ul>
</div>
<div class="search-wrap">
<input type="text" id="searchInput" placeholder="搜索地点..." autocomplete="off">
<ul class="search-dropdown" id="searchDropdown"></ul>
</div>
<label>半径</label>
<div class="radius-wrap">
<input type="number" id="radiusInput" value="2000" min="100" max="50000" step="100">
<span style="font-size:11px;color:#999">米</span>
</div>
<button class="btn btn-primary" id="addBtn">📍 添加地块</button>
<button class="btn btn-outline" id="clearAllBtn">✕ 全部清除</button>
<button class="btn btn-primary" id="copyBtn" disabled>📋 复制结果</button>
</div>

<!-- Main -->
<div class="main">
<div class="map-container" id="mapContainer">
<div id="map" style="width:100%;height:100%"></div>
<div class="loading-overlay hidden" id="loadingOverlay"><div class="spinner"></div><div>加载数据中…</div></div>
</div>
<div class="results-panel" id="resultsPanel">
<div class="hint">👆 在地图上点选位置，然后点「添加地块」</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
// ============================================================
// Config
// ============================================================
const AMAP_KEY='653175298a4a55e4a56de4bedc412dd6';
const GRID_S=500,GRID_A=GRID_S*GRID_S,GRID_C=GRID_S*Math.SQRT2/2;
const SCALE=100000;

const CITIES=[
'北京','上海','广州','深圳','成都','重庆','杭州','武汉','西安','南京',
'天津','苏州','长沙','郑州','东莞','青岛','沈阳','佛山','济南','大连',
'合肥','无锡','宁波','厦门','福州','温州','南宁','贵阳','昆明','南昌',
'海口','太原','石家庄','兰州','烟台','泉州','徐州','常州','南通','扬州',
'绍兴','嘉兴','台州','金华','盐城','宜昌','襄阳','珠海','咸阳','三亚',
'连云港','宿迁'
];

// Default centers for quick map jump
const CITY_CENTERS={
'北京':[116.4075,39.9042],'上海':[121.4737,31.2304],'广州':[113.2644,23.1291],
'深圳':[114.0579,22.5431],'成都':[104.0658,30.6575],'重庆':[106.5516,29.5630],
'杭州':[120.1551,30.2741],'武汉':[114.3054,30.5931],'西安':[108.9402,34.2611],
'南京':[118.7969,32.0603],'天津':[117.1901,39.1252],'苏州':[120.5853,31.2989],
'长沙':[112.9388,28.2278],'郑州':[113.6254,34.7466],'东莞':[113.7518,23.0205],
'青岛':[120.3826,36.0671],'沈阳':[123.4315,41.8057],'佛山':[113.1219,23.0215],
'济南':[117.1205,36.6512],'大连':[121.6147,38.9140],'合肥':[117.2272,31.8206],
'无锡':[120.3119,31.4912],'宁波':[121.5504,29.8683],'厦门':[118.0894,24.4798],
'福州':[119.2965,26.0745],'温州':[120.6994,27.9943],'南宁':[108.3661,22.8170],
'贵阳':[106.6302,26.6477],'昆明':[102.8329,24.8801],'南昌':[115.8579,28.6820],
'海口':[110.1983,20.0440],'太原':[112.5489,37.8706],'石家庄':[114.5149,38.0428],
'兰州':[103.8343,36.0611],'烟台':[121.4479,37.4635],'泉州':[118.6759,24.8741],
'徐州':[117.2841,34.2048],'常州':[119.9740,31.8107],'南通':[120.8937,31.9806],
'扬州':[119.4129,32.3936],'绍兴':[120.5802,30.0318],'嘉兴':[120.7556,30.7460],
'台州':[121.4206,28.6563],'金华':[119.6476,29.0792],'盐城':[120.1616,33.3495],
'宜昌':[111.2865,30.6918],'襄阳':[112.1224,32.0090],'珠海':[113.5767,22.2707],
'咸阳':[108.7091,34.3298],'三亚':[109.5119,18.2528],'连云港':[119.2229,34.5967],
'宿迁':[118.2754,33.9615]
};

// ============================================================
// State
// ============================================================
let map,circleMarker,centerMarker;
let currentCity=null;          // city name string
let cityGrids=null;           // loaded grid data (integer arrays) or null
let cityBBox=null;            // [xmin,ymin,xmax,ymax]
let cityCache={};             // {cityName: {bbox, grids}}
let pendingCenter=null;       // [lng,lat] awaiting city load
let resultsList=[];           // [{id, name, lng, lat, radius, ...stats...}]
let nextId=1;
let searchTimer=null;
let citySearchTimer=null;

// Layer groups for multiple circles
let circleLayerGroup=L.layerGroup();

// ============================================================
// Map
// ============================================================
function initMap(){
map=L.map('map',{zoomControl:true}).setView(CITY_CENTERS['成都'].reverse(),12);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
subdomains:'1234',attribution:'&copy; 高德',maxZoom:18
}).addTo(map);
circleLayerGroup.addTo(map);
map.on('click',function(e){
pendingCenter=[e.latlng.lng,e.latlng.lat];
reverseGeocode(e.latlng.lng,e.latlng.lat);
drawTempCircle();
});
}

// ============================================================
// Data loading (lazy, cached)
// ============================================================
function showLoading(){document.getElementById('loadingOverlay').classList.remove('hidden')}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden')}

async function loadCityData(name){
if(cityCache[name]){
cityGrids=cityCache[name].grids;
cityBBox=cityCache[name].bbox;
currentCity=name;
return;
}
showLoading();
try{
const resp=await fetch('data/'+name+'.json');
if(!resp.ok)throw new Error(resp.status);
const raw=await resp.json();
const grids=raw.g; // [[lng_i,lat_i,rp,rd,wp,wd,mp,md,op,od],...]
cityCache[name]={bbox:raw.b,grids:grids};
cityGrids=grids;
cityBBox=raw.b;
currentCity=name;
}catch(e){
showToast('加载失败: '+e.message);
}
hideLoading();
}

function getCitySafe(name){
return loadCityData(name).then(function(){
if(pendingCenter){
setTimeout(function(){drawTempCircle()},50);
}
});
}

// ============================================================
// City search
// ============================================================
function filterCities(q){
q=q.toLowerCase();
return CITIES.filter(function(c){return c.toLowerCase().includes(q)||c.includes(q)});
}

function showCityDropdown(list){
var dd=document.getElementById('cityDropdown');
dd.innerHTML='';
if(!list||list.length===0){dd.style.display='none';return}
list.forEach(function(c){
var li=document.createElement('li');
li.textContent=c;
li.addEventListener('click',function(){
dd.style.display='none';
document.getElementById('cityInput').value=c;
switchCity(c);
});
dd.appendChild(li);
});
dd.style.display='block';
}

function switchCity(name){
if(name===currentCity)return;
loadCityData(name).then(function(){
var cc=CITY_CENTERS[name];
if(cc)map.setView(cc.reverse(),12);
pendingCenter=null;
clearAllResults();
});
}

// ============================================================
// Geocoding
// ============================================================
async function searchSuggestions(kw){
var city=currentCity||'全国';
var url='https://restapi.amap.com/v3/assistant/inputtips?keywords='+encodeURIComponent(kw)+'&city='+encodeURIComponent(city)+'&citylimit=true&output=JSON&key='+AMAP_KEY;
var resp=await fetch(url);
var data=await resp.json();
if(data.status==='1'&&data.tips)return data.tips.filter(function(t){return t.location&&t.location.length>0});
return[];
}

async function geocode(addr){
var city=currentCity||'全国';
var url='https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(addr)+'&city='+encodeURIComponent(city)+'&output=JSON&key='+AMAP_KEY;
var resp=await fetch(url);
var data=await resp.json();
if(data.status==='1'&&data.geocodes&&data.geocodes.length>0){
var loc=data.geocodes[0].location.split(',').map(Number);
return {lng:loc[0],lat:loc[1],name:data.geocodes[0].formatted_address};
}
return null;
}

async function reverseGeocode(lng,lat){
try{
var url='https://restapi.amap.com/v3/geocode/regeo?location='+lng+','+lat+'&output=JSON&key='+AMAP_KEY;
var resp=await fetch(url);
var data=await resp.json();
if(data.status==='1'&&data.regeocode){
document.getElementById('searchInput').value=data.regeocode.formatted_address||'';
var addr=data.regeocode.addressComponent||{};
// Build road-level name
var road='';
if(addr.road)road=addr.road;
else if(addr.street)road=addr.street;
else if(addr.neighborhood)road=addr.neighborhood&&addr.neighborhood.name||'';
else road=addr.district||'';
window._lastRoad=road;
window._lastCity=data.regeocode.addressComponent&&data.regeocode.addressComponent.city||currentCity||'';
}
}catch(e){}
}

// ============================================================
// Circle drawing
// ============================================================
var COLORS=['#1677ff','#52c41a','#fa8c16','#722ed1','#eb2f96','#13c2c2','#f5222d','#2f54eb'];
function getColor(i){return COLORS[i%COLORS.length]}

function drawTempCircle(){
circleLayerGroup.clearLayers();
// Draw all saved results
resultsList.forEach(function(r,i){
var c=getColor(i);
circleLayerGroup.addLayer(L.circle([r.lat,r.lng],{radius:r.radius,color:c,fillColor:c,fillOpacity:.1,weight:2,dashArray:'6,4'}));
var lbl=L.divIcon({html:'<div style="background:'+c+';color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;white-space:nowrap">'+(i+1)+'</div>',iconSize:[0,0],iconAnchor:[-8,8]});
circleLayerGroup.addLayer(L.marker([r.lat,r.lng],{icon:lbl}));
});
// Draw pending center
if(pendingCenter){
circleLayerGroup.addLayer(L.circleMarker([pendingCenter[1],pendingCenter[0]],{radius:8,color:'#ff4d4f',fillColor:'#ff4d4f',fillOpacity:.4,weight:2}));
}
// Auto-fit
if(resultsList.length>0||pendingCenter){
var allLats=resultsList.map(function(r){return r.lat});
var allLngs=resultsList.map(function(r){return r.lng});
if(pendingCenter){allLats.push(pendingCenter[1]);allLngs.push(pendingCenter[0])}
var minLat=Math.min.apply(null,allLats),maxLat=Math.max.apply(null,allLats);
var minLng=Math.min.apply(null,allLngs),maxLng=Math.max.apply(null,allLngs);
var bounds=L.latLngBounds([[minLat-0.01,minLng-0.01],[maxLat+0.01,maxLng+0.01]]);
map.fitBounds(bounds.pad(0.2));
}
}

// ============================================================
// Compute single result (Method C)
// ============================================================
function computeOne(lng,lat,radius){
var t0=performance.now();
var circlePoly=turf.circle([lng,lat],radius/1000,{steps:64,units:'kilometers'});
var bbox=turf.bbox(circlePoly);
var bxmin=bbox[0],bymin=bbox[1],bxmax=bbox[2],bymax=bbox[3];
var centerTurf=turf.point([lng,lat]);

var rp=0,rdw=0,rdwt=0,wp=0,wdw=0,wdwt=0,mp=0,mdw=0,mdwt=0,op=0,odw=0,odwt=0;
var covered=0,gc=0,fc=0,bc=0;

for(var i=0;i<cityGrids.length;i++){
var g=cityGrids[i];
var glng=g[0]/SCALE,glat=g[1]/SCALE;
if(glng<bxmin-.005||glng>bxmax+.005||glat<bymin-.005||glat>bymax+.005)continue;

var gridPt=turf.point([glng,glat]);
var dist=turf.distance(centerTurf,gridPt,{units:'meters'});
var ratio;
if(dist+GRID_C<=radius){ratio=1.0;fc++}
else if(dist-GRID_C>=radius)continue;
else{
bc++;
var lpm=1/111320,lpml=1/(111320*Math.cos(glat*Math.PI/180));
var half=GRID_S/2;
var sq=turf.bboxPolygon([glng-half*lpml,glat-half*lpm,glng+half*lpml,glat+half*lpm]);
try{
var inter=turf.intersect(circlePoly,sq);
if(inter)ratio=Math.min(1,turf.area(inter)/GRID_A);
else if(turf.booleanPointInPolygon(gridPt,circlePoly))ratio=1.0;
else continue;
}catch(e){if(dist<radius)ratio=1.0;else continue}
}
if(ratio<=0)continue;
gc++;
var ca=GRID_A*ratio;
covered+=ca;
rp+=g[2]*ratio;wp+=g[4]*ratio;mp+=g[6]*ratio;op+=g[8]*ratio;
if(g[3]>0){rdw+=g[3]*ca;rdwt+=ca}
if(g[5]>0){wdw+=g[5]*ca;wdwt+=ca}
if(g[7]>0){mdw+=g[7]*ca;mdwt+=ca}
if(g[9]>0){odw+=g[9]*ca;odwt+=ca}
}

return{
lng:lng,lat:lat,radius:radius,
resPop:rp,resDen:rdwt>0?rdw/rdwt:0,
workPop:wp,workDen:wdwt>0?wdw/wdwt:0,
mixPop:mp,mixDen:mdwt>0?mdw/mdwt:0,
otPop:op,otDen:odwt>0?odw/odwt:0,
gridCount:gc,fullIn:fc,boundary:bc,
area:covered/1e6,elapsed:performance.now()-t0
};
}

// ============================================================
// Make name: {城市}{道路}地块{1km/500m}
// ============================================================
function makeName(lng,lat,radius){
var city=window._lastCity||currentCity||'';
var road=window._lastRoad||'';
if(!road||road.length===0)road='';
var rStr=radius>=1000?(radius/1000).toFixed(1).replace('.0','')+'km':radius+'m';
var name=city+road+'地块'+rStr;
return name;
}

// ============================================================
// Add result
// ============================================================
async function addResult(){
if(!currentCity||!cityGrids){showToast('请先选择城市');return}
if(!pendingCenter){showToast('请在地图上点击或搜索地点');return}

var lng=pendingCenter[0],lat=pendingCenter[1];
var radius=parseInt(document.getElementById('radiusInput').value)||2000;
document.getElementById('radiusInput').value=radius;

var name=makeName(lng,lat,radius);
var stats=computeOne(lng,lat,radius);
var entry={id:nextId++,name:name,lng:lng,lat:lat,radius:radius,city:currentCity,stats:stats};
resultsList.push(entry);
pendingCenter=null;
drawTempCircle();
renderResults();
showToast('✅ 已添加: '+name);
}

// ============================================================
// Render results table
// ============================================================
function renderResults(){
var panel=document.getElementById('resultsPanel');
var copyBtn=document.getElementById('copyBtn');

if(resultsList.length===0){
panel.innerHTML='<div class="hint">👆 在地图上点选位置，然后点「添加地块」</div>';
copyBtn.disabled=true;
return;
}
copyBtn.disabled=false;

var allGrids=0,allTime=0;
resultsList.forEach(function(r){allGrids+=r.stats.gridCount;allTime+=r.stats.elapsed});

var html='<h3>📊 统计结果 <span style="font-weight:400;font-size:12px;color:#999">（'+resultsList.length+'个地块）</span></h3>';
html+='<table class="results-table"><thead><tr><th>编号</th><th>名称</th><th>居住人口</th><th>密度</th><th>工作人口</th><th>密度</th><th>职住净人口</th><th>密度</th><th>加班人口</th><th>密度</th><th>操作</th></tr></thead><tbody>';

resultsList.forEach(function(r,i){
var s=r.stats;
html+='<tr>';
html+='<td>'+(i+1)+'</td>';
html+='<td>'+r.name+'</td>';
html+='<td>'+fmt(s.resPop)+'</td><td>'+fmt(s.resDen)+'</td>';
html+='<td>'+fmt(s.workPop)+'</td><td>'+fmt(s.workDen)+'</td>';
html+='<td>'+fmt(s.mixPop)+'</td><td>'+fmt(s.mixDen)+'</td>';
html+='<td>'+fmt(s.otPop)+'</td><td>'+fmt(s.otDen)+'</td>';
html+='<td><button class="del-btn" onclick="deleteResult('+r.id+')">🗑️</button></td>';
html+='</tr>';
});

html+='</tbody></table>';
html+='<div class="legend">';
html+='📐 计算方法：面积加权交集（方案C）<br>';
html+='🔢 总覆盖网格：'+allGrids+' 个<br>';
html+='📊 数据来源：猎鹰 · 2025年6月<br>';
html+='💡 提示：支持多个地块对比，可跨城市<br>';
html+='</div>';

panel.innerHTML=html;
}

function deleteResult(id){
resultsList=resultsList.filter(function(r){return r.id!==id});
drawTempCircle();
renderResults();
if(resultsList.length===0)pendingCenter=null;
showToast('已删除');
}

function clearAllResults(){
resultsList=[];
pendingCenter=null;
drawTempCircle();
renderResults();
showToast('已全部清除');
}

function fmt(n){
return Math.round(n).toLocaleString('zh-CN',{maximumFractionDigits:0});
}

// ============================================================
// Copy
// ============================================================
async function copyResults(){
if(resultsList.length===0)return;

var rows='';
resultsList.forEach(function(r){
var s=r.stats;
rows+='<tr><td>'+r.name+'</td><td>'+Math.round(s.resPop)+'</td><td>'+Math.round(s.resDen)+'</td><td>'+Math.round(s.workPop)+'</td><td>'+Math.round(s.workDen)+'</td><td>'+Math.round(s.mixPop)+'</td><td>'+Math.round(s.mixDen)+'</td><td>'+Math.round(s.otPop)+'</td><td>'+Math.round(s.otDen)+'</td></tr>';
});

var html='<html><body><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-family:\'微软雅黑\',Arial,sans-serif;font-size:11pt"><tr style="font-weight:bold;text-align:center"><td>名称</td><td>居住人口</td><td>密度</td><td>工作人口</td><td>密度</td><td>职住净人口</td><td>密度</td><td>加班人口</td><td>密度</td></tr>'+rows+'</table><p style="font-size:10pt;color:#888">数据来源：猎鹰 · 2025年6月</p></body></html>';

var textRows=['名称\t居住人口\t密度\t工作人口\t密度\t职住净人口\t密度\t加班人口\t密度'];
resultsList.forEach(function(r){var s=r.stats;textRows.push(r.name+'\t'+Math.round(s.resPop)+'\t'+Math.round(s.resDen)+'\t'+Math.round(s.workPop)+'\t'+Math.round(s.workDen)+'\t'+Math.round(s.mixPop)+'\t'+Math.round(s.mixDen)+'\t'+Math.round(s.otPop)+'\t'+Math.round(s.otDen))});
textRows.push('数据来源：猎鹰 · 2025年6月');

try{
var ci=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([textRows.join('\n')],{type:'text/plain'})});
await navigator.clipboard.write([ci]);
showToast('✅ 已复制 '+resultsList.length+' 个地块（带格式）');
}catch(e){
try{
var el=document.createElement('div');el.innerHTML=html;el.style.cssText='position:absolute;left:-9999px';
document.body.appendChild(el);var rng=document.createRange();rng.selectNodeContents(el);
var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rng);document.execCommand('copy');
sel.removeAllRanges();document.body.removeChild(el);showToast('✅ 已复制（带格式）');
}catch(e2){await navigator.clipboard.writeText(textRows.join('\n'));showToast('✅ 已复制（纯文本）')}
}
}

function showToast(msg){
var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},2500);
}

// ============================================================
// Event bindings
// ============================================================
document.getElementById('cityInput').addEventListener('input',function(){
var q=this.value.trim();
clearTimeout(citySearchTimer);
citySearchTimer=setTimeout(function(){
if(q.length===0){showCityDropdown(CITIES)}else{showCityDropdown(filterCities(q))}
},150);
});
document.getElementById('cityInput').addEventListener('focus',function(){
showCityDropdown(CITIES);
});
document.getElementById('cityInput').addEventListener('change',function(){
var name=this.value.trim();
if(CITIES.indexOf(name)>=0)switchCity(name);
});

document.getElementById('searchInput').addEventListener('input',function(){
var q=this.value.trim();
if(q.length<1){document.getElementById('searchDropdown').style.display='none';return}
clearTimeout(searchTimer);
searchTimer=setTimeout(async function(){
var tips=await searchSuggestions(q);
var dd=document.getElementById('searchDropdown');dd.innerHTML='';
if(tips.length>0){
tips.forEach(function(tip){
var li=document.createElement('li');
li.innerHTML='<span class="sname">'+tip.name+'</span><span class="saddr">'+(tip.district||'')+'</span>';
li.addEventListener('click',async function(){dd.style.display='none';
document.getElementById('searchInput').value=tip.name;
var geo=await geocode(tip.name);
if(geo){pendingCenter=[geo.lng,geo.lat];drawTempCircle();map.setView([geo.lat,geo.lng],15)}
});
dd.appendChild(li);
});dd.style.display='block';
}else{dd.style.display='none'}
},300);
});

document.getElementById('searchInput').addEventListener('keydown',async function(e){
if(e.key==='Enter'){
clearTimeout(searchTimer);
document.getElementById('searchDropdown').style.display='none';
var q=this.value.trim();
if(q){var geo=await geocode(q);
if(geo){pendingCenter=[geo.lng,geo.lat];drawTempCircle();map.setView([geo.lat,geo.lng],15)}
else showToast('未找到该地点')}
}
});

document.addEventListener('click',function(e){
if(!e.target.closest('.search-wrap'))document.getElementById('searchDropdown').style.display='none';
if(!e.target.closest('.city-wrap'))document.getElementById('cityDropdown').style.display='none';
});

document.getElementById('radiusInput').addEventListener('change',function(){
var v=Math.max(100,Math.min(50000,parseInt(this.value)||2000));
this.value=v;
});

document.getElementById('addBtn').addEventListener('click',addResult);
document.getElementById('clearAllBtn').addEventListener('click',clearAllResults);
document.getElementById('copyBtn').addEventListener('click',copyResults);

// ============================================================
// Startup
// ============================================================
initMap();
loadCityData('成都').then(function(){
document.getElementById('cityInput').value='成都';
});
</script>
</body>
</html>
